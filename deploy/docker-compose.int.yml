# Testumgebung «int» auf demselben Server wie die Produktion (eigene Datenbank, eigene Container, kein eigenes HTTPS).
# Caddy der Produktion leitet int.<APP_DOMAIN> an «int-app» weiter (Netzwerk pontivo-int). Anleitung: docs/deploy/3-testumgebung.md.
name: pontivo-int

x-app: &app
  image: pontivo-int-app:latest
  env_file: .env.int
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://pontivo:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@db:5432/pontivo
    UPLOAD_DIR: /app/data/uploads
    HOSTNAME: 0.0.0.0
    SMTP_URL: smtp://mailpit:1025
    PORT: "3000"
  restart: unless-stopped

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pontivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      POSTGRES_DB: pontivo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pontivo -d pontivo"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    build: { context: .., dockerfile: Dockerfile }
    command: ["node", "--import", "tsx", "scripts/migrate.ts"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  app:
    <<: *app
    volumes: [uploads:/app/data/uploads]
    networks:
      default: {}
      web: { aliases: [int-app] }
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Mail-Fänger: int verschickt nie echte Mails, alles landet hier (Oberfläche: https://int.<Domain>/mail, hinter dem int-Passwort)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_WEBROOT: /mail
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
    volumes: [mail:/data]
    networks:
      default: {}
      web: { aliases: [int-mailpit] }

  worker:
    <<: *app
    command: ["node", "--import", "tsx", "src/jobs/worker.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  uploads:
  mail:

networks:
  web:
    name: pontivo-int
    external: true
